services:
  # ─────────────────────────────────────────
  # PostgreSQL Database (Local Development)
  # ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_pass
      POSTGRES_DB: erp_crm_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d erp_crm_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Backend API (Express + Prisma)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://erp_user:erp_pass@db:5432/erp_crm_db
      DIRECT_URL: postgresql://erp_user:erp_pass@db:5432/erp_crm_db
      JWT_SECRET: docker-local-dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ─────────────────────────────────────────
  # Frontend (React + Vite → Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points to backend - uses host networking from browser
        VITE_API_BASE_URL: http://localhost:5000
    container_name: erp_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:80'

volumes:
  postgres_data:
    name: erp_postgres_data
